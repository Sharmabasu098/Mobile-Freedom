name: Deploy Mobile Freedom to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build website
        run: npm run build -- --base=/Mobile-Freedom/

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload production build
        id: upload-pages
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: ./dist

      - name: Verify Pages artifact output
        env:
          PAGES_ARTIFACT_ID: ${{ steps.upload-pages.outputs.artifact_id }}
        run: |
          if [ -z "$PAGES_ARTIFACT_ID" ]; then
            echo "GitHub Pages artifact upload did not return an artifact ID."
            exit 1
          fi
          echo "GitHub Pages artifact uploaded successfully (ID: $PAGES_ARTIFACT_ID)."

      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
