name: VF-01.3 Unit Tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - vf01.3-multilingual-understanding

permissions:
  contents: read

jobs:
  unit-tests:
    name: Vitest Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run unit tests
        run: npm test
