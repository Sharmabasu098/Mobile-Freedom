name: VF-02.4.4 Test Matrix

on:
  push:
    branches:
      - vf-02.4.4-clean-test-matrix
  pull_request:
    branches:
      - vf-02.4.2-memory-extraction-test-matrix
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-matrix:
    name: Memory Extraction Matrix + Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Run Vitest suite
        run: npm test
      - name: TypeScript and production build
        run: npm run build
      - name: Verify build artifact
        run: test -s dist/index.html
